<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Maison — Reset Password</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #fbf6ef;

            color: #3e2c27;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 20px 60px rgba(77, 53, 43, .13);
        }

        h1 {
            font-family: Georgia, serif;

            font-size: 32px;

            margin-bottom: 8px;
        }

        p {
            color: #8c7c75;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        label {
            display: block;

            font-size: 11px;

            font-weight: bold;

            margin-bottom: 7px;

            color: #60483e;
        }

        input {
            width: 100%;

            height: 48px;

            border: 1px solid #eaded2;

            border-radius: 10px;

            padding: 0 14px;

            margin-bottom: 18px;

            outline: none;

            font-size: 14px;
        }

        input:focus {
            border-color: #b86f52;
        }

        button {
            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 10px;

            background: #60483e;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #3e2c27;
        }

        .message {
            display: none;

            padding: 12px;

            border-radius: 9px;

            margin-bottom: 18px;

            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .error {
            background: #f8e7e4;

            color: #9c5145;
        }

        .success {
            background: #e8f0e5;

            color: #55704d;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #b86f52;

            text-decoration: none;

            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>Reset your password</h1>

    <p>
        Create a new password for your Maison account.
    </p>

    <div
        id="message"
        class="message"
    ></div>

    <form id="resetForm">

        <label for="password">
            NEW PASSWORD
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            required
        >


        <label for="confirmPassword">
            CONFIRM PASSWORD
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            minlength="8"
            required
        >


        <button type="submit">
            Change Password
        </button>

    </form>

    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>

</div>


<script>

const form =
    document.getElementById("resetForm");

const password =
    document.getElementById("password");

const confirmPassword =
    document.getElementById("confirmPassword");

const message =
    document.getElementById("message");


/* Get token from URL */

const params =
    new URLSearchParams(
        window.location.search
    );

const token =
    params.get("token");


function showMessage(text, type) {

    message.textContent =
        text;

    message.className =
        "message show " + type;

}


/* No token */

if (!token) {

    showMessage(
        "Invalid or missing password reset link.",
        "error"
    );

}


/* Submit */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!token) {

            return;

        }


        const passwordValue =
            password.value;

        const confirmValue =
            confirmPassword.value;


        if (passwordValue.length < 8) {

            showMessage(
                "Password must contain at least 8 characters.",
                "error"
            );

            return;

        }


        if (passwordValue !== confirmValue) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        try {

            const response =
                await fetch(
                    "http://localhost:5000/api/auth/reset-password",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            token: token,

                            password: passwordValue

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Unable to reset password."
                );

            }


            showMessage(
                "Password changed successfully! Redirecting to login...",
                "success"
            );


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);


        } catch (error) {

            console.error(
                error
            );

            showMessage(
                error.message,
                "error"
            );

        }

    }
);

</script>

</body>

</html>
